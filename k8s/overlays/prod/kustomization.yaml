apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kadke
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 30
    target:
      kind: HorizontalPodAutoscaler
images:
  - name: ghcr.io/kadke/backend
    newTag: stable
  - name: ghcr.io/kadke/frontend
    newTag: stable
