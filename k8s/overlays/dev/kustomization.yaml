apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kadke-dev
resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: frontend
  - patch: |-
      - op: replace
        path: /metadata/name
        value: kadke-dev
    target:
      kind: Namespace
      name: kadke
