apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels: {{- include "kadke.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  PORT: {{ .Values.config.port | quote }}
  API_PREFIX: {{ .Values.config.apiPrefix | quote }}
  CORS_ORIGIN: {{ printf "https://%s" .Values.global.domain | quote }}
  JWT_ACCESS_EXPIRES: {{ .Values.config.jwtAccessExpires | quote }}
  JWT_REFRESH_EXPIRES: {{ .Values.config.jwtRefreshExpires | quote }}
  THROTTLE_TTL: {{ .Values.config.throttleTtl | quote }}
  THROTTLE_LIMIT: {{ .Values.config.throttleLimit | quote }}
  REDIS_URL: "redis://{{ .Release.Name }}-redis:6379"
  S3_ENDPOINT: "http://{{ .Release.Name }}-minio:9000"
  S3_BUCKET: {{ .Values.minio.bucket | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "kadke.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDb | quote }}
  JWT_ACCESS_SECRET: {{ .Values.secrets.jwtAccessSecret | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.jwtRefreshSecret | quote }}
  RAZORPAY_KEY_ID: {{ .Values.secrets.razorpayKeyId | quote }}
  RAZORPAY_KEY_SECRET: {{ .Values.secrets.razorpayKeySecret | quote }}
  RAZORPAY_WEBHOOK_SECRET: {{ .Values.secrets.razorpayWebhookSecret | quote }}
  GOOGLE_CLIENT_ID: {{ .Values.secrets.googleClientId | quote }}
  GOOGLE_CLIENT_SECRET: {{ .Values.secrets.googleClientSecret | quote }}
  S3_ACCESS_KEY: {{ .Values.secrets.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.secrets.s3SecretKey | quote }}
