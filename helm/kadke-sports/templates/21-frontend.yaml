{{- if .Values.frontend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  selector: { app: frontend, release: {{ .Release.Name }} }
  ports: [{ name: http, port: {{ .Values.frontend.service.port }}, targetPort: {{ .Values.frontend.service.targetPort }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: frontend, release: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: frontend, release: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: {{ .Values.frontend.service.targetPort }} }]
          env:
            - { name: NEXT_PUBLIC_API_URL,  value: "https://{{ .Values.global.apiDomain }}/api" }
            - { name: NEXT_PUBLIC_SITE_URL, value: "https://{{ .Values.global.domain }}" }
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.frontend.service.targetPort }} }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /, port: {{ .Values.frontend.service.targetPort }} }
            initialDelaySeconds: 30
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
{{- if .Values.frontend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-frontend
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.frontend.autoscaling.targetCPU }} }
{{- end }}
{{- end }}
