services:
  postgres:
    image: postgres:16-alpine
    container_name: kadke-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kadke}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kadke_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kadke_sports}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kadke}"]
      interval: 10s
      retries: 5
    networks: [kadke]

  redis:
    image: redis:7-alpine
    container_name: kadke-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports: ["6379:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks: [kadke]

  minio:
    image: minio/minio:latest
    container_name: kadke-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      retries: 5
    networks: [kadke]

  minio-bucket-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      mc mb -p local/${S3_BUCKET:-kadke-products};
      mc anonymous set download local/${S3_BUCKET:-kadke-products};
      exit 0;
      "
    networks: [kadke]

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: kadke-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-kadke}:${POSTGRES_PASSWORD:-kadke_pass}@postgres:5432/${POSTGRES_DB:-kadke_sports}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-kadke-products}
      CORS_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    command: node dist/main.js
    networks: [kadke]

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    container_name: kadke-frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
    ports: ["3000:3000"]
    networks: [kadke]

  prometheus:
    image: prom/prometheus:latest
    container_name: kadke-prometheus
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    networks: [kadke]
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:latest
    container_name: kadke-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes: [grafana_data:/var/lib/grafana]
    ports: ["3001:3000"]
    networks: [kadke]
    profiles: ["observability"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  grafana_data:

networks:
  kadke:
    driver: bridge
