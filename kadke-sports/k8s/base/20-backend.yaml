apiVersion: v1
kind: ServiceAccount
metadata:
  name: kadke-backend
  namespace: kadke
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: kadke
  labels: { app: backend }
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 80, targetPort: 4000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: kadke
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/metrics"
        prometheus.io/port: "4000"
    spec:
      serviceAccountName: kadke-backend
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: migrate
          image: ghcr.io/kadke/backend:latest
          command: ["sh", "-c", "npx prisma migrate deploy"]
          envFrom:
            - configMapRef: { name: kadke-config }
            - secretRef:    { name: kadke-secrets }
      containers:
        - name: backend
          image: ghcr.io/kadke/backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000, name: http }]
          envFrom:
            - configMapRef: { name: kadke-config }
            - secretRef:    { name: kadke-secrets }
          readinessProbe:
            httpGet: { path: /api/health/ready, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { memory: 256Mi, cpu: 200m }
            limits:   { memory: 768Mi, cpu: 1000m }
          lifecycle:
            preStop:
              exec: { command: ["/bin/sh", "-c", "sleep 10"] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: kadke
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 80 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: kadke
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: backend }
