{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-backend
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
spec:
  selector: { app: backend, release: {{ .Release.Name }} }
  ports: [{ name: http, port: {{ .Values.backend.service.port }}, targetPort: {{ .Values.backend.service.targetPort }} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: backend, release: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app: backend, release: {{ .Release.Name }} }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/api/metrics"
        prometheus.io/port: "4000"
    spec:
      serviceAccountName: {{ .Release.Name }}-backend
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      {{- if .Values.backend.runMigrations }}
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: [sh, -c, "npx prisma migrate deploy"]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
            - secretRef:    { name: {{ .Release.Name }}-secrets }
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports: [{ containerPort: {{ .Values.backend.service.targetPort }} }]
          envFrom:
            - configMapRef: { name: {{ .Release.Name }}-config }
            - secretRef:    { name: {{ .Release.Name }}-secrets }
          readinessProbe:
            httpGet: { path: /api/health/ready, port: {{ .Values.backend.service.targetPort }} }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: {{ .Values.backend.service.targetPort }} }
            initialDelaySeconds: 30
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          lifecycle:
            preStop:
              exec: { command: [/bin/sh, -c, "sleep 10"] }
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-backend
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.backend.autoscaling.targetCPU }} }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-backend
spec:
  minAvailable: {{ .Values.backend.pdb.minAvailable }}
  selector:
    matchLabels: { app: backend, release: {{ .Release.Name }} }
{{- end }}
