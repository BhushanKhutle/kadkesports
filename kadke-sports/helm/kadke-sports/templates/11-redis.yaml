{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-redis
spec:
  selector: { app: redis, release: {{ .Release.Name }} }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-redis
spec:
  replicas: 1
  selector: { matchLabels: { app: redis, release: {{ .Release.Name }} } }
  template:
    metadata: { labels: { app: redis, release: {{ .Release.Name }} } }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: [redis-server, --appendonly, "yes"]
          ports: [{ containerPort: 6379 }]
          resources: {{- toYaml .Values.redis.resources | nindent 12 }}
{{- end }}
